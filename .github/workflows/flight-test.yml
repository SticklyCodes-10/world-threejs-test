name: Flight test build

on:
  push:
    branches:
      - flight-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flight-test-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build flight simulator
        run: npm run build
